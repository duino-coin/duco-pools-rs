[package]
name = "pool-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
exclude = ["work/source", "work/source-next"]

[dependencies]
anyhow = "1.0.100"
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
warp = { version = "0.4.2", features = ["server"] }
sha1_smol = { version = "1.0.1", features = ["alloc", "std"] }
bytes = "1"
sysinfo = { git = "https://github.com/profpandaa/sysinfo-modified", rev = "54102d8" }
