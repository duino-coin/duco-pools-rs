[package]
name = "duco-pool-rs"
version = "0.2.0"
edition = "2021"

[dependencies]
config = { version = "0.15.25", features = ["json"] }
log = "0.4.34"
rand = "0.10.2"
reqwest = { version = "0.12.23", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.47.1", features = ["full"] }
hex = "0.4.3"
dashmap = { version = "6.2.1", features = ["serde"] }
base64 = "0.23.1"
sha1 = "0.10.7"
sha2 = "0.11.0"
itoa = "1.0.18"
sysinfo = { git = "https://github.com/profpandaa/sysinfo-modified", rev = "54102d8" }
ctrlc = { version = "3.5.2", features = ["termination"] }
warp = { version = "0.4.3", features = ["server"] }
env_logger = "0.11.11"
anyhow = "1.0.104"
rlimit = "0.11.0"
mimalloc = "0.1.52"
compact_str = { version = "0.10.0", features = ["serde"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
arc-swap = "1.9.2"
memchr = "2.8.3"
socket2 = "0.6.5"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.local]
inherits = "release"
debug-assertions = true
strip = false

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[features]
bench = []
dummy_sync = []


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(compile_env, values("test"))', 'cfg(run_env, values("bench"))'] }

[target."cfg(windows)".dependencies]
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
