[package]
name = "duco-pool-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
arcstr = "1.2.0"
config = { version = "0.15.18", features = ["json"]}
log = "0.4.28"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
hex = "0.4.3"
dashmap = {version = "6.1.0", features = ["serde"]}
base64 = "0.22.1"
sha1_smol = { version = "1.0.1", features = ["alloc", "std"] }
itoa = "1.0.15"
sysinfo = "0.37.2"
ctrlc = { version = "3.5.0", features = ["termination"] }
warp = { version = "0.4.2", features = ["server"] }
env_logger = "0.11.8"
anyhow = "1.0.100"
rlimit = "0.10.2"
mimalloc = "0.1.48"
tokio-util = { version = "0.7.16", features = ["rt"] }
#pprof = { version = "0.15.0", features = ["flamegraph"]}

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
